openapi: 3.0.3
info:
  title: AwLPay Wallets API
  version: 1.0.0
paths:
  /v1/wallets:
    post:
      summary: Create wallet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner_id: {type: string}
                chain: {type: string, enum: [solana, base, ethereum]}
      responses:
        '200':
          description: Wallet created
  /v1/wallets/{id}/balance:
    get:
      summary: Get balance
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
  /v1/quote:
    post:
      summary: Get fee quote
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_cents: {type: integer}
                tier: {type: string, enum: [free, pro, l33t]}
      responses:
        '200': {description: OK}
  /v1/settle:
    post:
      summary: Settle payment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from_wallet, to_wallet, amount_cents]
              properties:
                from_wallet: {type: string}
                to_wallet: {type: string}
                amount_cents: {type: integer}
                tier: {type: string}
      responses:
        '200': {description: OK}
